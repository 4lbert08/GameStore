<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../assets/css/partials/gameInShoppingCart.css" rel="stylesheet">
    <title>Detalle de Pedido</title>

</head>
<body>

<div class="gameInShopping-card">
    <div class="gameInShopping-status">En carrito</div>
    <div class="gameInShopping-content">
        <div class="product-image">
            <img src="../../assets/imgs/fifa22.png" alt="">

            <div class="product-name">FIFA 22</div>
        </div>

        <div class="gameInShopping-details">
            <div class="gameInShopping-specs">
                <div class="spec-item">
                    <span class="spec-label">Sistema: PC</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Plataforma: Steam</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Precio: 50$</span>
                </div>
            </div>
            <div class="gameInShopping-price"></div>
            <div class="quantity-container">
                <input type="number" class="quantity-input" value="1" min="1">
            </div>
        </div>


        <div class="gameInShopping-actions">
            <button class="remove-btn">🗑 Eliminar</button>
            <button class="checkout-btn">💳 Proceder al pago</button>
        </div>
    </div>
</div>

</body>
</html>
