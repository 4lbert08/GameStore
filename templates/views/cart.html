<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link rel="stylesheet" type="text/css" href="../../assets/css/views/cart.css">
    <script type="module" src="../../assets/js/modules/viewsScripts/cart.js"></script>
</head>
<body>

<header id="main_header"></header>

<div class="main_container">
    <div class="main">

        <h1>Your Cart</h1>

        <div class="cart">
            <div class="cart_carousel"></div>

            <div class="payment">
                <h2 class="payment__title">Resumen de compra</h2>

                <div class="payment__details">
                    <div class="payment__row">
                        <span class="payment__label">Subtotal:</span>
                        <span class="payment__value">XXXX$</span>
                    </div>

                    <div class="payment__row">
                        <span class="payment__label">Descuento:</span>
                        <span class="payment__value payment__discount">-XXXX$</span>
                    </div>

                    <div class="payment__divider"></div>

                    <div class="payment__row payment__total">
                        <span class="payment__label">Total:</span>
                        <span class="payment__value">XXXX$</span>
                    </div>
                </div>

                <button class="payment__button" type="button" onclick="location.href='checkout.html'">
                    <span class="payment__button-text">Proceder con el pago</span>
                    <span class="payment__button-icon">→</span>
                </button>

                <a class="payment__keep-buying" href="index.html">
                    <img class="payment__arrow-icon" src="../../assets/imgs/flecha.png" alt="Flecha">
                    <span>Seguir comprando</span>
                </a>
            </div>
        </div>

        <h2>Recomendaciones</h2>

        <div class="suggested">
            <div id="gameSuggested1"></div>
            <div id="gameSuggested2"></div>
            <div id="gameSuggested3"></div>
        </div>

    </div>
</div>

<footer id="footer"></footer>
</body>
</html>
